definitions:
  structs.CommonResponse:
    properties:
      data: {}
      failed:
        type: integer
      message:
        type: string
      resultCount:
        type: integer
      statusCode:
        type: integer
      success:
        type: integer
      total:
        type: integer
    type: object
  structs.CreateUser:
    properties:
      email:
        example: example@email.com
        type: string
      password:
        example: password123
        type: string
      role:
        example: superadmin
        type: string
      username:
        example: John Doe
        type: string
    type: object
  structs.Login:
    properties:
      email:
        example: developer@mail.com
        type: string
      password:
        example: password
        type: string
    type: object
  structs.PageView:
    properties:
      endDt:
        example: "2024-05-11"
        type: string
      mdn:
        example: "081284088408"
        type: string
      page:
        example: 1
        type: integer
      shift:
        example: sore
        type: string
      startDt:
        example: "2024-05-11"
        type: string
      status:
        example: 20
        type: integer
      view:
        example: 10
        type: integer
    type: object
info:
  contact: {}
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: User Login
      parameters:
      - description: request body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/structs.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.CommonResponse'
      summary: User Login
      tags:
      - Auth
  /api/kpi/{database}/list:
