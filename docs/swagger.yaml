      parameters:
      - description: request body
        in: body
        name: data
        schema:
          $ref: '#/definitions/structs.PageView'
      - description: database path argument
        in: path
        name: database
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.CommonResponse'
      summary: List Data KPI
      tags:
      - KPI
