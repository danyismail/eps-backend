# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    # steps:
    # - uses: actions/checkout@v4

    # - name: Set up Go
    #   uses: actions/setup-go@v4
    #   with:
    #     go-version: '1.18'
    - name: Check Service
      run: pid=$(lsof -ti :1523)

    - name: Kill Service
      run: kill -9 $pid && cd go/src/eps-backend
      
    - name: Clear File
      run: rm -rf eps-api nohup.out go.mod go.sum && git pull origin development && go mod init

    - name: Run in backgroung
      run: go mod tidy && go build -o eps-api && nohup ./eps-api &
