# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
on:
  push:
    branches: ["development"]
jobs:
  deployment:
    runs-on: ubuntu-22.04
    steps:
      - name: action-with-emoji
        uses: MizukiSonoko/gh-action-with-emoji@v0.3

      - name: Print Secrets
        run: |
          echo "SSH_HOST: ${{ secrets.HOST }}"
          echo "SSH_USERNAME: ${{ secrets.USERNAME }}"

      - name: deploy production 💃😘
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            container_id=$(docker ps --filter "expose=1523" -q)
            if [ ! -z "$container_id" ]; then
                echo "container found, stop container.."
                docker stop $container_id
                echo "container has been stoped."
            else
                echo "container not found"
            fi
                echo "remove , pull , build and run"
                cd ~/go/src/eps-backend
                rm -rf go.mod go.sum && sudo git pull origin development
                docker build -t eps-backend-prod:latest .
                docker run -v /home/eps/go/src/eps-backend/uploads:/app/uploads -v /home/eps/backend-logs/app.log:/app/app.log  -p 1523:1523 -d eps-backend-prod
